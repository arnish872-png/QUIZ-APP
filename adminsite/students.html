<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
            overflow-x: hidden;
        }

        img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar Overlay for Mobile */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #1e293b;
            color: white;
            padding: 25px 15px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 999;
            transition: transform 0.3s ease;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #cbd5e1;
            padding: 13px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover,
        .menu .active {
            background: #334155;
            color: white;
        }

        /* Main Content */
        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
            transition: margin-left 0.3s ease, width 0.3s ease;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .topbar h1 {
            font-size: 28px;
            margin: 0;
        }

        .toggle-btn {
            display: none;
            background: #1e293b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 20px;
            cursor: pointer;
        }

        .admin {
            background: white;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Table */
        .table-box {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .table-box h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .hide {
            display: none !important;
        }

        .show {
            display: block !important;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        th {
            color: #475569;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .status {
            background: #dcfce7;
            color: #15803d;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .toggle-btn {
                display: block;
            }

            .table-box {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar" id="sidebar">

            <div class="logo">
                Admin Panel
            </div>

            <ul class="menu">
                <li>
                    <a href="./dashboard.html">🏠 Dashboard</a>
                </li>

                <li>
                    <a href="#" class="active">👨‍🎓 Students</a>
                </li>

                <li>
                    <a href="#">👨‍🏫 Teachers</a>
                </li>

                <li>
                    <a href="./courses.html">📚 Courses</a>
                </li>

                <li>
                    <a href="./quiz.html">💳 Quizs</a>
                </li>

                <li>
                    <a href="#">📊 Reports</a>
                </li>

                <li>
                    <a href="#">⚙️ Settings</a>
                </li>

                <li>
                    <a href="#">🚪 Logout</a>
                </li>
            </ul>

        </aside>


        <main class="main">

            <div class="topbar">

                <div class="topbar-left">
                    <button class="toggle-btn" id="toggleBtn">☰</button>
                    <h1>Students List</h1>
                </div>

                <div class="admin">
                    👤 Admin
                </div>

            </div>


            <div id="loading" style="text-align: center;">
                <img style="width: 200px; height: 200px;"
                    src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
                    alt="Loading...">
            </div>


            <section class="table-box hide" id="maintable">

                <table>

                    <thead>
                        <tr>
                            <th>S.no</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Picture</th>
                            <th>Course</th>
                        </tr>
                    </thead>

                    <tbody id="users">
                    </tbody>

                </table>

            </section>

        </main>

    </div>


    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAMSEBdmS2jckZ-kLTE5jH6o-m6tB2Efg",
            authDomain: "quiz-app-54289.firebaseapp.com",
            databaseURL: "https://quiz-app-54289-default-rtdb.firebaseio.com",
            projectId: "quiz-app-54289",
            storageBucket: "quiz-app-54289.firebasestorage.app",
            messagingSenderId: "712398639546",
            appId: "1:712398639546:web:d97590003d422ec7c70d83",
            measurementId: "G-JDMVVJCYWF"
        };
        firebase.initializeApp(firebaseConfig);

        // Responsive Sidebar Toggle Logic
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        }

        toggleBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);
    </script>

    <script src="students.js"></script>

</body>

</html>
