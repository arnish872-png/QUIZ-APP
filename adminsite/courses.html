<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Courses</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- FontAwesome Icons for Hamburger and Sidebar Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
            overflow-x: hidden;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Responsive Sidebar Overlay */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1040;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 240px;
            background: #1e293b;
            color: white;
            padding: 25px 15px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 1050;
            transition: transform 0.3s ease, width 0.3s ease;
            overflow-y: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-text {
            width: 100%;
            text-align: center;
        }

        .btn-close-sidebar {
            display: none;
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 20px;
            cursor: pointer;
        }

        .menu {
            list-style: none;
            padding-left: 0;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #cbd5e1;
            padding: 13px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover,
        .menu .active {
            background: #334155;
            color: white;
        }

        /* Main Content */
        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
            transition: margin-left 0.3s ease, width 0.3s ease;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toggle-sidebar-btn {
            display: none;
            background: #1e293b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-sidebar-btn:hover {
            background: #334155;
        }

        .topbar h1 {
            font-size: 28px;
            margin: 0;
        }

        .admin {
            background: white;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-weight: 500;
        }

        /* Table Box */
        .table-box {
            background: white;
            margin-top: 20px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .table-box h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            color: #475569;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        /* Mobile Sidebar Responsiveness */
        @media (max-width: 750px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .btn-close-sidebar {
                display: block;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .toggle-sidebar-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .topbar {
                flex-direction: row;
                justify-content: space-between;
            }

            .table-box {
                overflow-x: auto;
            }

            table {
                min-width: 550px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Mobile Overlay Backdrop -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

            <div class="logo">
                <span class="logo-text">Admin Panel</span>
                <button class="btn-close-sidebar" onclick="toggleSidebar()" aria-label="Close Sidebar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <ul class="menu">
                <li>
                    <a href="./dashboard.html">🏠 <span>Dashboard</span></a>
                </li>
                <li>
                    <a href="./students.html">👨‍🎓 <span>Students</span></a>
                </li>
                <li>
                    <a href="#">👨‍🏫 <span>Teachers</span></a>
                </li>
                <li>
                    <a href="#" class="active">📚 <span>Courses</span></a>
                </li>
                <li>
                    <a href="./quiz.html">💳 <span>Quizs</span></a>
                </li>
                <li>
                    <a href="#">📊 <span>Reports</span></a>
                </li>
                <li>
                    <a href="#">⚙️ <span>Settings</span></a>
                </li>
                <li>
                    <a href="#">🚪 <span>Logout</span></a>
                </li>
            </ul>

        </aside>

        <!-- Main Content -->
        <main class="main">

            <!-- Top Bar -->
            <div class="topbar">

                <div class="topbar-left">
                    <!-- Toggle Button for Mobile -->
                    <button class="toggle-sidebar-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h1>Course Page</h1>
                </div>

                <div class="admin">
                    👤 Admin
                </div>

            </div>

            <!-- Recent Courses Table Section -->
            <section class="table-box">
                <div style="text-align: right">
                    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                        + Add new Course
                    </button>
                </div>

                <h2>Course List</h2>

                <table>
                    <thead>
                        <tr>
                            <th>S.no</th>
                            <th>Course name</th>
                            <th>Fees</th>
                            <th>Duration</th>
                        </tr>
                    </thead>

                    <tbody id="courseTable">
                        <!-- Courses populated dynamically via JavaScript -->
                    </tbody>
                </table>
            </section>

        </main>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Add New Course</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 row">
                        <label for="courseName" class="col-sm-4 col-form-label">Course Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="courseName">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="courseduration" class="col-sm-4 col-form-label">Course Duration</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="courseduration">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="coursefee" class="col-sm-4 col-form-label">Course fees</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="coursefee">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="addNewCourse()">Save Course</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAAMSEBdmS2jckZ-kLTE5jH6o-m6tB2Efg",
            authDomain: "quiz-app-54289.firebaseapp.com",
            databaseURL: "https://quiz-app-54289-default-rtdb.firebaseio.com",
            projectId: "quiz-app-54289",
            storageBucket: "quiz-app-54289.firebasestorage.app",
            messagingSenderId: "712398639546",
            appId: "1:712398639546:web:d97590003d422ec7c70d83",
            measurementId: "G-JDMVVJCYWF"
        };
        firebase.initializeApp(firebaseConfig);

        // Sidebar Toggle Handler Function
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
    </script>

    <!-- External Logic File -->
    <script src="courses.js"></script>

</body>

</html>
