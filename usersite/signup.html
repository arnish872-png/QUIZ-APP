<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h2 {
            color: #333333;
            text-align: center;
            margin-bottom: 8px;
        }

        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-upload-wrapper label {
            font-size: 14px;
            color: #666;
        }

        input[type="file"] {
            font-size: 14px;
        }

        input[type="email"],
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
        }

        #loading {
            color: #667eea;
            font-size: 14px;
            text-align: center;
        }

        button#signup {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }
        

        button#signup:hover {
            background-color: #5a6fd1;
        }

        .login-link {
            text-align: center;
            font-size: 14px;
            color: #666666;
            margin-top: 8px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Create Account</h2>

        <div class="file-upload-wrapper">
            <label for="imageUpload">Profile Picture</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <b id="loading" style="display: none;">Loading.....</b>

        <input type="text" placeholder="Enter Name" id="name">
        <input type="email" placeholder="Enter Email Address" id="email">
        <input type="password" placeholder="Enter Password" id="password">

        <select name="" id="courseList" style="display: none;">
            <option value="" disabled selected>Select Course</option>
        </select>

        <button id="signup">Sign Up</button>

        <p class="login-link">
            Already have an account? <a href="./login.html">Login</a>
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

</body>
